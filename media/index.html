<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; style-src 'unsafe-inline' {{cspSource}}; script-src 'nonce-{{nonce}}' https://3dmol.org;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3Dmol Viewer</title>
  <link rel="stylesheet" href="{{styleUri}}">
</head>
<body style="--viewer-bg: {{backgroundColor}}; --viewer-fg: {{foregroundColor}};">
  <div id="viewer"></div>
  <script nonce="{{nonce}}" src="https://3dmol.org/build/3Dmol-min.js"></script>
  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
